name: Verify study and word challenge

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the change
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install development-only test packages
        run: |
          python -m pip install playwright==1.62.0 pypdf==6.21.4 reportlab==4.4.9
          npm ci --prefix tests --ignore-scripts --no-audit --no-fund
      - name: Verify content, privacy, handouts, and JavaScript
        run: |
          python tests/verify.py
          python tests/verify_routes.py
          python tests/verify_student_artifact.py
          python tests/verify_handout.py
          python tests/verify_amos_release.py
          node --check study.js
          node --check explore.js
          node --check game.js
          npm test --prefix tests
      - name: Package the reviewed student site
        run: python scripts/build_student_site.py --output "$RUNNER_TEMP/student-site"
      - name: Verify Chromium interactions and responsive layout
        env:
          STUDENT_SITE_ROOT: ${{ runner.temp }}/student-site
          CHROME_PATH: /usr/bin/google-chrome
          DANIEL_SCREENSHOT_DIR: /tmp/daniel-game-screenshots
        run: |
          python tests/verify_game.py
          python tests/verify_lessons.py
      - name: Keep browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daniel-word-challenge-browser
          path: /tmp/daniel-game-screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload verified student site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/student-site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    outputs:
      page_url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: student-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    steps:
      - name: Check Pages publishing source
        id: pages-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)
          case "$type" in
            workflow)
              current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
              if [ "$current" = "$GITHUB_SHA" ]; then
                echo 'active=true' >> "$GITHUB_OUTPUT"
              else
                echo 'Skipping an older verification run; main has advanced.'
              fi
              ;;
            legacy) echo 'Pages still uses branch publishing; no source was changed.' ;;
            *) echo "Unexpected Pages publishing mode: $type"; exit 1 ;;
          esac
      - name: Deploy verified student site
        id: release
        if: steps.pages-source.outputs.active == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  smoke:
    if: needs.deploy.outputs.page_url != ''
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - name: Check out the deployed change
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check live student URLs and exclusions
        run: python scripts/smoke_student_pages.py
