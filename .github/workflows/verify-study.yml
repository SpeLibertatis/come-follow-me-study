name: Verify study and word challenge

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the change
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install development-only test packages
        run: |
          python -m pip install playwright==1.62.0 pypdf==6.21.4 reportlab==4.4.9
          npm ci --prefix tests --ignore-scripts --no-audit --no-fund
      - name: Verify content, privacy, handouts, and JavaScript
        run: |
          python tests/verify.py
          python tests/verify_handout.py
          node --check study.js
          node --check explore.js
          node --check game.js
          npm test --prefix tests
      - name: Verify Chromium interactions and responsive layout
        env:
          CHROME_PATH: /usr/bin/google-chrome
          DANIEL_SCREENSHOT_DIR: /tmp/daniel-game-screenshots
        run: python tests/verify_game.py
      - name: Keep browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daniel-word-challenge-browser
          path: /tmp/daniel-game-screenshots
          if-no-files-found: ignore
          retention-days: 7
